[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "An evaluated enterprise knowledge agent combining RAG, graph retrieval, and tool-using LLM workflows."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.2",
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "langgraph==1.2.10",
    "pydantic-settings==2.14.1",
    "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.22",
]
nlp = [
    "gliner2[local]==1.3.2",
]
graph = [
    "neo4j==6.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_knowledge_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
